<main>
    <Section>
    <div class="container">
        <header>
            <img src="Images/gojo-face.jpg" alt="gojo-face">
            <h2>Submit a Mission Request!</h2>
            <p>Have you spotted a cursed spirit?! Need an Escort? Fill out your information and we will dispatch a sorcerer to your location.</p>
        </header>
<form method="post" action="https://webdevbasics.net/scripts/demo.php">
    <div class="form-group">
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname" required maxlength="30">
    </div>

    <div class="form-group">
        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname" required maxlength="30">
    </div>

    <div class="form-group">
        <label for="email">Location:</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required placeholder="123-456-7890">
    </div>

    <div class="form-group">
        <label for="curselevel">Estimated Threat Level</label>
        <select id="curselevel" Name="curselevel" required>
            <option value="">-- Select a Threat Level --</option>
            <option value="low">Grade 4 - Grade 3 (Low Threat)</option>
            <option value="high">Grade 2 - Grade 1 (High Threat)</option>
            <option value="special">Special Grade (YOU BETTER START RUNNING!)</option>
        </select> 
    </div>

    <div class="form-group">
        <div class="contact-options">
            <input type="checkbox" id="terms" required>
            <label for="terms">I confirm this infromation is 100% accurate.</label>
        </div>
    </div>
    <div class="form-group button-group">
        <input type="submit" value="HURRY!!">
        <input type="reset" value="Clear Form">
    </div>
</div>
</form>
</Section>
</main>
